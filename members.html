<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Membres - Petel Association</title>
  <meta name="theme-color" content="#116149">

  <style>
    :root {
      --green: #116149;
      --dark-green: #0b4435;
      --light: #f2f7f4;
      --red: #b42318;
      --border: #d8e4dc;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 16px;
      font-family: Arial, sans-serif;
      background: var(--light);
      color: #1f2933;
    }

    .container {
      width: 100%;
      max-width: 950px;
      margin: 0 auto;
    }

    header {
      background: var(--green);
      color: white;
      padding: 22px 16px;
      text-align: center;
      border-radius: 12px;
      margin-bottom: 18px;
    }

    header h1 {
      font-size: 23px;
      margin: 0 0 8px;
    }

    header p { margin: 0; }

    .card {
      background: white;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 18px;
      margin-bottom: 18px;
      box-shadow: 0 2px 8px rgba(0,0,0,.04);
    }

    h2 {
      font-size: 20px;
      color: var(--dark-green);
      margin-top: 0;
    }

    label {
      display: block;
      font-weight: bold;
      margin: 12px 0 6px;
    }

    input, select {
      display: block;
      width: 100%;
      padding: 12px;
      border: 1px solid #bdcfc3;
      border-radius: 8px;
      font-size: 16px;
      background: white;
    }

    button {
      padding: 11px 15px;
      border: 0;
      border-radius: 8px;
      background: var(--green);
      color: white;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      margin: 8px 5px 0 0;
    }

    button.secondary { background: #52665b; }
    button.danger { background: var(--red); }
    button:disabled { opacity: .6; cursor: wait; }

    .hidden { display: none !important; }

    .notice {
      padding: 12px;
      margin: 12px 0;
      border-radius: 8px;
      overflow-wrap: anywhere;
    }

    .notice.info { background: #e7f1ff; color: #164785; }
    .notice.success { background: #e3f6e9; color: #14532d; }
    .notice.error { background: #fee8e7; color: #8c1d18; }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .table-wrap { overflow-x: auto; }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 12px;
      background: white;
    }

    th, td {
      padding: 11px;
      text-align: left;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }

    th {
      background: #e7f1eb;
      color: var(--dark-green);
    }

    .actions { min-width: 150px; }

    #memberForm { margin-top: 15px; }

    footer {
      text-align: center;
      color: #53645a;
      font-size: 13px;
      padding: 10px;
    }

    @media (max-width: 600px) {
      body { padding: 9px; }
      header h1 { font-size: 20px; }
      .card { padding: 13px; }
      button { width: 100%; margin-right: 0; }
    }
  </style>
</head>

<body>
  <div class="container">
    <header>
      <h1>Petel Association</h1>
      <p>Solidarité &amp; Développement — Gestion des membres</p>
    </header>

    <div id="notice" class="notice info" role="status">
      Initialisation de la connexion...
    </div>

    <section id="loginSection" class="card">
      <h2>Connexion</h2>

      <form id="loginForm">
        <label for="loginEmail">Adresse e-mail</label>
        <input
          id="loginEmail"
          type="email"
          autocomplete="username"
          required
          placeholder="Votre adresse e-mail"
        >

        <label for="loginPassword">Mot de passe</label>
        <input
          id="loginPassword"
          type="password"
          autocomplete="current-password"
          required
          placeholder="Votre mot de passe"
        >

        <button id="loginButton" type="submit" disabled>
          Préparation...
        </button>
      </form>
    </section>

    <section id="appSection" class="hidden">
      <div class="card">
        <div class="toolbar">
          <div>
            <h2 style="margin-bottom:6px">Liste des membres</h2>
            <div id="userInfo"></div>
          </div>
          <button id="logoutButton" class="secondary" type="button">
            Se déconnecter
          </button>
        </div>

        <div id="adminArea" class="hidden">
          <hr>
          <h2 id="formTitle">Ajouter un membre</h2>

          <form id="memberForm">
            <input id="memberId" type="hidden">

            <label for="firstName">Prénom</label>
            <input id="firstName" type="text" maxlength="100" required>

            <label for="lastName">Nom</label>
            <input id="lastName" type="text" maxlength="100" required>

            <label for="phone">Téléphone</label>
            <input id="phone" type="tel" maxlength="40">

            <label for="status">Statut</label>
            <select id="status" required>
              <option value="Actif">Actif</option>
              <option value="Inactif">Inactif</option>
              <option value="Honneur">Membre d'honneur</option>
            </select>

            <button id="saveButton" type="submit">
              Enregistrer le membre
            </button>

            <button id="cancelButton" class="secondary hidden"
              type="button">
              Annuler la modification
            </button>
          </form>
        </div>

        <div class="toolbar" style="margin-top:18px">
          <strong id="memberCount">0 membre</strong>
          <button id="refreshButton" class="secondary" type="button">
            Actualiser la liste
          </button>
        </div>

        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Prénom</th>
                <th>Nom</th>
                <th>Téléphone</th>
                <th>Statut</th>
                <th id="actionsHeader" class="hidden">Actions</th>
              </tr>
            </thead>
            <tbody id="membersBody">
              <tr><td colspan="5">En attente des données...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </section>

    <footer>
      Petel Association Solidarité &amp; Développement
    </footer>
  </div>

  <script type="module">
    import { createClient } from
      "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

    const SUPABASE_URL =
      "https://evbpmafgciphyfzmkctc.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_b0oe1ZbLmoW52Ym69nIhfQ_IwfvOiip";

    const notice = document.getElementById("notice");
    const loginSection = document.getElementById("loginSection");
    const appSection = document.getElementById("appSection");
    const loginForm = document.getElementById("loginForm");
    const loginButton = document.getElementById("loginButton");
    const logoutButton = document.getElementById("logoutButton");
    const userInfo = document.getElementById("userInfo");
    const adminArea = document.getElementById("adminArea");
    const memberForm = document.getElementById("memberForm");
    const membersBody = document.getElementById("membersBody");
    const memberCount = document.getElementById("memberCount");
    const refreshButton = document.getElementById("refreshButton");
    const cancelButton = document.getElementById("cancelButton");
    const saveButton = document.getElementById("saveButton");
    const actionsHeader = document.getElementById("actionsHeader");

    let db = null;
    let currentUser = null;
    let isAdmin = false;
    let busy = false;

    function showMessage(text, type = "info") {
      notice.textContent = text;
      notice.className = "notice " + type;
      notice.classList.remove("hidden");
    }

    function setBusy(value) {
      busy = value;
      loginButton.disabled = value || !db;
      loginButton.textContent = value
        ? "Patientez..."
        : "Se connecter";
      saveButton.disabled = value;
      logoutButton.disabled = value;
      refreshButton.disabled = value;
    }

    function showLoggedOut() {
      currentUser = null;
      isAdmin = false;
      appSection.classList.add("hidden");
      loginSection.classList.remove("hidden");
      adminArea.classList.add("hidden");
      actionsHeader.classList.add("hidden");
      loginButton.disabled = !db;
      loginButton.textContent = "Se connecter";
      membersBody.replaceChildren();
      memberCount.textContent = "0 membre";
      userInfo.textContent = "";
    }

    function cell(text) {
      const td = document.createElement("td");
      td.textContent = text == null ? "" : String(text);
      return td;
    }

    async function getRole(user) {
      const { data, error } = await db
        .from("profiles")
        .select("role")
        .eq("id", user.id)
        .maybeSingle();

      if (error) throw error;

      return String(data?.role || "").toLowerCase();
    }

    async function loadMembers() {
      showMessage("Chargement des membres...", "info");
      refreshButton.disabled = true;

      try {
        const { data, error } = await db
          .from("members")
          .select("id, first_name, last_name, phone, status")
          .order("last_name", { ascending: true });

        if (error) throw error;

        membersBody.replaceChildren();

        if (!data || data.length === 0) {
          const tr = document.createElement("tr");
          const td = cell("Aucun membre enregistré.");
          td.colSpan = isAdmin ? 5 : 4;
          tr.appendChild(td);
          membersBody.appendChild(tr);
        } else {
          for (const member of data) {
            const tr = document.createElement("tr");
            tr.appendChild(cell(member.first_name));
            tr.appendChild(cell(member.last_name));
            tr.appendChild(cell(member.phone));
            tr.appendChild(cell(member.status));

            if (isAdmin) {
              const td = document.createElement("td");
              td.className = "actions";

              const edit = document.createElement("button");
              edit.type = "button";
              edit.textContent = "Modifier";
              edit.addEventListener("click", () => editMember(member));

              const del = document.createElement("button");
              del.type = "button";
              del.className = "danger";
              del.textContent = "Supprimer";
              del.addEventListener("click", () => deleteMember(member));

              td.append(edit, del);
              tr.appendChild(td);
            }

            membersBody.appendChild(tr);
          }
        }

        memberCount.textContent =
          data.length + (data.length > 1 ? " membres" : " membre");

        showMessage("Liste des membres chargée.", "success");
      } catch (error) {
        console.error("Erreur de chargement :", error);
        showMessage(
          "Impossible de charger les membres. Vérifie la table members et ses règles d'accès Supabase. Détail : " +
          (error.message || "erreur inconnue"),
          "error"
        );
      } finally {
        refreshButton.disabled = false;
      }
    }

    function editMember(member) {
      if (!isAdmin) {
        showMessage("Seul l'administrateur peut modifier les membres.", "error");
        return;
      }

      document.getElementById("memberId").value = member.id;
      document.getElementById("firstName").value = member.first_name || "";
      document.getElementById("lastName").value = member.last_name || "";
      document.getElementById("phone").value = member.phone || "";

      const statusSelect = document.getElementById("status");
      const status = member.status || "Actif";

      if (![...statusSelect.options].some(o => o.value === status)) {
        const option = document.createElement("option");
        option.value = status;
        option.textContent = status;
        statusSelect.appendChild(option);
      }

      statusSelect.value = status;
      document.getElementById("formTitle").textContent = "Modifier un membre";
      saveButton.textContent = "Enregistrer les modifications";
      cancelButton.classList.remove("hidden");
      document.getElementById("firstName").focus();
    }

    function resetMemberForm() {
      memberForm.reset();
      document.getElementById("memberId").value = "";
      document.getElementById("formTitle").textContent = "Ajouter un membre";
      saveButton.textContent = "Enregistrer le membre";
      cancelButton.classList.add("hidden");
    }

    async function deleteMember(member) {
      if (!isAdmin) {
        showMessage("Action réservée à l'administrateur.", "error");
        return;
      }

      const confirmed = confirm(
        "Supprimer " + member.first_name + " " + member.last_name + " ?"
      );

      if (!confirmed) return;

      try {
        const { error } = await db
          .from("members")
          .delete()
          .eq("id", member.id);

        if (error) throw error;

        showMessage("Membre supprimé.", "success");
        await loadMembers();
      } catch (error) {
        console.error("Erreur de suppression :", error);
        showMessage(
          "Suppression impossible. Vérifie les règles d'accès Supabase. " +
          (error.message || ""),
          "error"
        );
      }
    }

    async function openUserSession(user) {
      currentUser = user;

      try {
        const role = await getRole(user);
        isAdmin = role === "admin" || role === "administrateur";

        loginSection.classList.add("hidden");
        appSection.classList.remove("hidden");
        adminArea.classList.toggle("hidden", !isAdmin);
        actionsHeader.classList.toggle("hidden", !isAdmin);

        userInfo.textContent = user.email
          ? user.email + " — rôle : " +
            (isAdmin ? "Administrateur" : "Lecteur")
          : "Rôle : " + (isAdmin ? "Administrateur" : "Lecteur");

        if (isAdmin) {
          showMessage("Connexion réussie en tant qu'administrateur.", "success");
        } else {
          showMessage("Connexion réussie en mode consultation.", "success");
        }

        await loadMembers();
      } catch (error) {
        console.error("Erreur de vérification du rôle :", error);
        showLoggedOut();
        showMessage(
          "Impossible de vérifier votre rôle. Vérifie la table profiles, " +
          "et assure-toi qu'un profil existe avec id égal à l'identifiant " +
          "de l'utilisateur connecté. Détail : " + (error.message || ""),
          "error"
        );
      }
    }

    loginForm.addEventListener("submit", async event => {
      event.preventDefault();

      if (busy) return;

      if (!db || !db.auth) {
        showMessage(
          "Supabase n'est pas encore prêt. Actualise la page puis réessaie.",
          "error"
        );
        return;
      }

      const email = document.getElementById("loginEmail").value.trim();
      const password = document.getElementById("loginPassword").value;

      if (!email || !password) {
        showMessage("Saisis ton adresse e-mail et ton mot de passe.", "error");
        return;
      }

      setBusy(true);
      showMessage("Connexion en cours...", "info");

      try {
        const { data, error } = await db.auth.signInWithPassword({
          email,
          password
        });

        if (error) throw error;

        if (!data.user) {
          throw new Error("Aucun utilisateur retourné par Supabase.");
        }

        await openUserSession(data.user);
      } catch (error) {
        console.error("Erreur de connexion :", error);
        showMessage(
          "Connexion impossible : " +
          (error.message || "vérifie ton e-mail et ton mot de passe."),
          "error"
        );
      } finally {
        setBusy(false);
      }
    });

    memberForm.addEventListener("submit", async event => {
      event.preventDefault();

      if (!isAdmin || !currentUser || busy) {
        showMessage("Seul l'administrateur connecté peut enregistrer un membre.", "error");
        return;
      }

      const id = document.getElementById("memberId").value;
      const first_name = document.getElementById("firstName").value.trim();
      const last_name = document.getElementById("lastName").value.trim();
      const phone = document.getElementById("phone").value.trim();
      const status = document.getElementById("status").value;

      if (!first_name || !last_name) {
        showMessage("Le prénom et le nom sont obligatoires.", "error");
        return;
      }

      setBusy(true);
      showMessage("Enregistrement en cours...", "info");

      try {
        const record = { first_name, last_name, phone, status };

        let result;

        if (id) {
          result = await db
            .from("members")
            .update(record)
            .eq("id", id);
        } else {
          result = await db
            .from("members")
            .insert(record);
        }

        if (result.error) throw result.error;

        resetMemberForm();
        showMessage(id ? "Membre modifié." : "Membre ajouté.", "success");
        await loadMembers();
      } catch (error) {
        console.error("Erreur d'enregistrement :", error);
        showMessage(
          "Enregistrement impossible. Vérifie la structure de members et les règles d'accès. " +
          (error.message || ""),
          "error"
        );
      } finally {
        setBusy(false);
      }
    });

    cancelButton.addEventListener("click", resetMemberForm);

    refreshButton.addEventListener("click", async () => {
      if (currentUser) await loadMembers();
    });

    logoutButton.addEventListener("click", async () => {
      if (!db || busy) return;

      setBusy(true);

      try {
        const { error } = await db.auth.signOut();
        if (error) throw error;

        showLoggedOut();
        showMessage("Déconnexion réussie.", "success");
      } catch (error) {
        showMessage("Erreur de déconnexion : " + (error.message || ""), "error");
      } finally {
        setBusy(false);
      }
    });

    async function init() {
      showMessage("Initialisation de Supabase...", "info");

      try {
        db = createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

        if (!db || !db.auth) {
          throw new Error("Le client Supabase n'a pas pu être créé.");
        }

        loginButton.disabled = false;
        loginButton.textContent = "Se connecter";

        const { data, error } = await db.auth.getSession();
        if (error) throw error;

        if (data.session && data.session.user) {
          await openUserSession(data.session.user);
        } else {
          showLoggedOut();
          showMessage("Supabase est prêt. Connecte-toi pour continuer.", "success");
        }

        db.auth.onAuthStateChange((event, session) => {
          if (event === "SIGNED_OUT") {
            showLoggedOut();
            showMessage("Tu es déconnecté.", "info");
          }
        });
      } catch (error) {
        console.error("Initialisation Supabase :", error);
        loginButton.disabled = true;
        loginButton.textContent = "Connexion indisponible";
        showMessage(
          "Erreur d'initialisation Supabase : " +
          (error.message || "vérifie la connexion Internet, l'URL et la clé Publishable."),
          "error"
        );
      }
    }

    init();
  </script>
</body>
</html>
