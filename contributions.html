<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cotisations - Petel Association</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7f5;
      color: #24312b;
    }

    header {
      background: #087f5b;
      color: white;
      padding: 22px 15px;
      text-align: center;
    }

    header h1 {
      margin: 0 0 8px;
      font-size: 23px;
    }

    header p {
      margin: 0;
    }

    main {
      max-width: 950px;
      margin: auto;
      padding: 18px;
    }

    .card {
      background: white;
      padding: 18px;
      margin-bottom: 16px;
      border-radius: 12px;
      box-shadow: 0 2px 8px #00000010;
    }

    .back {
      display: inline-block;
      margin-bottom: 16px;
      color: #087f5b;
      text-decoration: none;
      font-weight: bold;
    }

    .total {
      color: #087f5b;
      font-size: 26px;
      font-weight: bold;
      margin: 10px 0;
      overflow-wrap: anywhere;
    }

    .table-wrap {
      width: 100%;
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: white;
    }

    th, td {
      text-align: left;
      padding: 11px 9px;
      border-bottom: 1px solid #ddd;
    }

    th {
      background: #e8f4ee;
      color: #174b38;
    }

    .notice {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      padding: 10px 0;
    }

    .error {
      color: #b42318;
    }

    .success {
      color: #087f5b;
    }

    .info {
      color: #555;
    }

    button {
      padding: 12px 16px;
      background: #087f5b;
      color: white;
      border: 0;
      border-radius: 8px;
      cursor: pointer;
    }

    footer {
      text-align: center;
      padding: 20px;
      color: #666;
    }
  </style>
</head>

<body>
  <header>
    <h1>Petel Association</h1>
    <p>Solidarité &amp; Développement — Cotisations</p>
  </header>

  <main>
    <a class="back" href="./dashboard.html">← Retour au tableau de bord</a>

    <section class="card">
      <h2>Total des cotisations</h2>
      <div id="total" class="total">Chargement...</div>
      <p id="nombre">Chargement des cotisations...</p>
    </section>

    <section class="card">
      <h2>Liste des cotisations</h2>
      <p id="notice" class="notice info" role="status" aria-live="polite">
        Connexion en cours...
      </p>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Membre</th>
              <th>Montant</th>
              <th>Période</th>
              <th>Date</th>
            </tr>
          </thead>
          <tbody id="liste">
            <tr>
              <td colspan="4">Chargement...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <footer>
    © 2026 Petel Association Solidarité &amp; Développement
  </footer>

  <script type="module">
    import { createClient }
      from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

    const SUPABASE_URL =
      "https://evbpmafgciphyfzmkctc.supabase.co";

    // Remplace cette valeur par la clé publique existante dans app.js.
    const SUPABASE_PUBLISHABLE_KEY =
      "COLLE_ICI_TA_CLE_PUBLIQUE_SUPABASE";

    const supabase = createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );

    const liste = document.getElementById("liste");
    const totalElement = document.getElementById("total");
    const nombreElement = document.getElementById("nombre");
    const notice = document.getElementById("notice");

    function afficherMessage(texte, type = "info") {
      notice.textContent = texte;
      notice.className = "notice " + type;
    }

    function formaterCFA(montant) {
      return Number(montant || 0).toLocaleString("fr-FR") + " FCFA";
    }

    function formaterDate(date) {
      if (!date) return "—";

      const valeur = String(date).slice(0, 10);
      const morceaux = valeur.split("-");

      if (morceaux.length !== 3) return valeur;

      return `${morceaux[2]}/${morceaux[1]}/${morceaux[0]}`;
    }

    async function demarrer() {
      try {
        if (
          !SUPABASE_PUBLISHABLE_KEY ||
          SUPABASE_PUBLISHABLE_KEY ===
            "COLLE_ICI_TA_CLE_PUBLIQUE_SUPABASE"
        ) {
          throw new Error(
            "Ajoute la clé publique Supabase déjà utilisée dans app.js."
          );
        }

        const { data: sessionData, error: sessionError } =
          await supabase.auth.getSession();

        if (sessionError) throw sessionError;

        if (!sessionData.session) {
          afficherMessage(
            "Connecte-toi d'abord depuis la page principale.",
            "error"
          );
          liste.innerHTML =
            '<tr><td colspan="4">Connexion nécessaire.</td></tr>';
          totalElement.textContent = "—";
          nombreElement.textContent = "";
          return;
        }

        const { data: profil, error: profilError } = await supabase
          .from("profiles")
          .select("role")
          .eq("id", sessionData.session.user.id)
          .maybeSingle();

        if (profilError) throw profilError;

        if (!profil) {
          throw new Error(
            "Profil introuvable. Vérifie le profil utilisateur dans Supabase."
          );
        }

        const { data, error } = await supabase
          .from("contributions")
          .select(`
            id,
            member_id,
            amount,
            period,
            payment_date,
            members(first_name, last_name)
          `)
          .order("payment_date", { ascending: false });

        if (error) throw error;

        liste.replaceChildren();

        let total = 0;

        for (const cotisation of data || []) {
          total += Number(cotisation.amount || 0);

          const membre = Array.isArray(cotisation.members)
            ? cotisation.members[0]
            : cotisation.members;

          const nom = membre
            ? `${membre.first_name || ""} ${membre.last_name || ""}`.trim()
            : "Membre non identifié";

          const ligne = document.createElement("tr");

          const valeurs = [
            nom,
            formaterCFA(cotisation.amount),
            cotisation.period || "—",
            formaterDate(cotisation.payment_date)
          ];

          for (const valeur of valeurs) {
            const cellule = document.createElement("td");
            cellule.textContent = valeur;
            ligne.appendChild(cellule);
          }

          liste.appendChild(ligne);
        }

        if (!data || data.length === 0) {
          liste.innerHTML =
            '<tr><td colspan="4">Aucune cotisation enregistrée.</td></tr>';
        }

        totalElement.textContent = formaterCFA(total);
        nombreElement.textContent =
          `${(data || []).length} cotisation(s) enregistrée(s).`;

        afficherMessage(
          profil.role === "admin"
            ? "Connecté en tant qu’administrateur."
            : "Mode consultation : les cotisations sont en lecture seule.",
          "success"
        );

      } catch (erreur) {
        console.error("Erreur cotisations :", erreur);

        afficherMessage(
          "Impossible de charger les cotisations : " +
          (erreur.message || "erreur inconnue"),
          "error"
        );

        totalElement.textContent = "—";
        nombreElement.textContent = "";

        liste.innerHTML =
          '<tr><td colspan="4">Erreur de chargement.</td></tr>';
      }
    }

    demarrer();
  </script>
</body>
</html>
