<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Petel Association</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="app">

    <div class="logo">PA</div>

    <h1>Petel Association</h1>
    <p class="subtitle">Solidarité & Développement</p>

    <div class="card">
      <h2>Connexion</h2>

      <label for="email">Adresse e-mail</label>
      <input type="email" id="email" placeholder="Votre adresse e-mail">

      <label for="password">Mot de passe</label>
      <input type="password" id="password" placeholder="Votre mot de passe">

      <button onclick="login()">Se connecter</button>

      <p id="message"></p>

      <a href="#" onclick="forgotPassword()">Mot de passe oublié ?</a>
    </div>

    <p class="footer">
      © 2026 Petel Association<br>
      Solidarité & Développement
    </p>

  </div>

  <script src="app.js"></script>
</body>
</html>
